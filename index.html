<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>App Hábitos</title>
  <meta name="description" content="Regista a tua alimentação, exercício, sono e hábitos diários.">

  <!-- PWA: torna a app instalável no ecrã principal -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#f3f5f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#131715" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <!-- Tipos de letra -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600&display=swap">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Cabeçalho: nome da app e acesso às definições -->
  <header id="topo" class="topo" hidden>
    <a href="#/inicio" class="marca" id="marca">App Hábitos</a>
    <div class="topo-acoes">
    <button type="button" id="atualizar" class="botao-icone" aria-label="Atualizar dados" title="Atualizar dados">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4.5h-4.5"/></svg>
    </button>
    <a href="#/definicoes" class="botao-icone" aria-label="Definições">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
    </a>
    </div>
  </header>

  <!-- Aqui é desenhado o ecrã atual (cada ecrã está em js/views/) -->
  <main id="ecra" class="ecra">
    <p class="a-carregar">A carregar…</p>
  </main>

  <!-- Barra de navegação de baixo -->
  <nav id="nav" class="nav" hidden aria-label="Navegação principal">
    <a href="#/inicio" data-rota="inicio">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5V20a1 1 0 0 1-1 1h-4.5v-5.5h-5V21H5a1 1 0 0 1-1-1Z"/></svg>
      <span>Início</span>
    </a>
    <a href="#/registar" data-rota="registar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span>Registar</span>
    </a>
    <a href="#/calendario" data-rota="calendario">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1Zm-1 4h16M8 3.5v4M16 3.5v4"/></svg>
      <span>Calendário</span>
    </a>
    <a href="#/tarefas" data-rota="tarefas">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6.5h11M9 12h11M9 17.5h11M4 6.5l1 1 2-2M4 12l1 1 2-2M4 17.5h3"/></svg>
      <span>Tarefas</span>
    </a>
    <a href="#/consultas" data-rota="consultas" id="nav-consultas" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Zm2 5h6M9 13h6M9 17h3"/></svg>
      <span>Consultas</span>
    </a>
  </nav>

  <!-- A app em si (módulos JavaScript) -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
